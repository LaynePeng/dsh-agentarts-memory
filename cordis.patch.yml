# dsh-agentarts-memory bundle layer.
#
# Inserts one Host plugin row. Every capability has its own switch so the plugin
# can be turned off completely without uninstalling it:
#
#   enabled: false          -> the whole plugin is inert (no tools, no hooks)
#   tools.enabled: false    -> no huawei_memory_* tools
#   recall.enabled: false   -> no automatic recall injection
#   capture.enabled: false  -> no transcript push after a session ends
#
# You can also flip the single row off in Plugins instead of editing this file.
- insert:
    - id: dsh-agentarts-memory
      name: '@laynepeng/dsh-agentarts-memory'
      config:
        enabled: true
        spaceId: ''
        apiKeyEnv: HUAWEICLOUD_SDK_MEMORY_API_KEY
        region: cn-southwest-2
        endpoint: ''
        actorId: dsh-user
        assistantId: dsh
        strategyId: ''
        strategyType: semantic
        timeoutMs: 5000
        recall:
          enabled: true
          topK: 5
          minScore: 0.35
          maxInjectTokens: 600
          cacheMs: 60000
          minQueryChars: 8
        tools:
          enabled: true
        capture:
          enabled: false
          maxMessages: 40
